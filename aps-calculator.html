<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS Calculator | Open Future+</title>
    <meta name="description" content="Calculate your APS score with the Open Future+ student tool." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a href="index.html" class="logo">Open Future<span>+</span></a>
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="opportunities.html">Opportunities</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="employers.html">Employers</a></li>
          <li><a href="contact.html">Get Help</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section tool-section">
        <div class="container tool-layout">
          <div class="section-heading">
            <p class="small-heading">APS CALCULATOR</p>
            <h2>Check your admission score.</h2>
            <p>Enter your final subjects and achievement levels to estimate your APS.</p>
          </div>

          <div class="tool-panel">
            <form id="apsForm" class="mini-form">
              <div class="input-grid">
                <div>
                  <label for="subject1">Subject 1</label>
                  <input id="subject1" type="text" value="English" />
                </div>
                <div>
                  <label for="percentage1">% or Level</label>
                  <input id="percentage1" type="number" min="0" max="100" step="1" placeholder="85 or choose below" />
                </div>
                <div>
                  <label for="level1">Level</label>
                  <select id="level1">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                  </select>
                </div>
              </div>

              <div class="input-grid">
                <div>
                  <label for="subject2">Subject 2</label>
                  <input id="subject2" type="text" value="Mathematics" />
                </div>
                <div>
                  <label for="percentage2">% or Level</label>
                  <input id="percentage2" type="number" min="0" max="100" step="1" placeholder="92 or choose below" />
                </div>
                <div>
                  <label for="level2">Level</label>
                  <select id="level2">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7" selected>7</option>
                  </select>
                </div>
              </div>

              <div class="input-grid">
                <div>
                  <label for="subject3">Subject 3</label>
                  <input id="subject3" type="text" value="Life Orientation" />
                </div>
                <div>
                  <label for="percentage3">% or Level</label>
                  <input id="percentage3" type="number" min="0" max="100" step="1" placeholder="75 or choose below" />
                </div>
                <div>
                  <label for="level3">Level</label>
                  <select id="level3">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5" selected>5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                  </select>
                </div>
              </div>

              <button type="submit" class="button primary">Calculate APS</button>
            </form>

            <div class="result-box" id="apsResult">Your APS score will appear here.</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-logo">Open Future<span>+</span></div>
        <p>No Limits. Just Possibilities.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
