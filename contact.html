<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Help | Open Future+</title>
    <meta name="description" content="Request support from Open Future+ and get help with your next step." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a href="index.html" class="logo">Open Future<span>+</span></a>
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="opportunities.html">Opportunities</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="employers.html">Employers</a></li>
          <li><a href="contact.html">Get Help</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="container contact-layout">
          <div class="section-heading left-align">
            <p class="small-heading">NEED HELP?</p>
            <h2>Tell us what you need.</h2>
            <p>Submit your details and we will help guide you toward the right next step.</p>
          </div>

          <form class="help-form" id="helpForm">
            <label for="name">Full Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required />

            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required />

            <label for="help">What do you need help with?</label>
            <textarea id="help" name="help" rows="5" placeholder="Tell us what support you need..." required></textarea>

            <button type="submit" class="button primary">Submit Request</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-logo">Open Future<span>+</span></div>
        <p>No Limits. Just Possibilities.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
