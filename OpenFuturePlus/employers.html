<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employers | Open Future+</title>
    <meta name="description" content="Employers can share opportunities and support youth growth through Open Future+." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a href="index.html" class="logo">Open Future<span>+</span></a>
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="opportunities.html">Opportunities</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="employers.html">Employers</a></li>
          <li><a href="contact.html">Get Help</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section">
        <div class="container employer-layout">
          <div class="section-heading left-align">
            <p class="small-heading">FOR EMPLOYERS</p>
            <h2>Share opportunities with young people.</h2>
            <p>Companies, organisations, and institutions can submit opportunities for students and young job seekers.</p>
          </div>

          <form class="employer-form">
            <label for="company-name">Company Name</label>
            <input id="company-name" type="text" placeholder="Enter company name" />

            <label for="opportunity-title">Opportunity Title</label>
            <input id="opportunity-title" type="text" placeholder="e.g. IT Internship" />

            <label for="opportunity-location">Location</label>
            <input id="opportunity-location" type="text" placeholder="e.g. Pretoria" />

            <button type="submit" class="button primary">Submit Opportunity</button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-logo">Open Future<span>+</span></div>
        <p>No Limits. Just Possibilities.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
