<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APS Calculator | Open Future+</title>
    <meta name="description" content="Calculate your APS score with the Open Future+ student tool." />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a href="index.html" class="logo">Open Future<span>+</span></a>
        <button class="menu-button" type="button" aria-label="Open menu">☰</button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="students.html">Students</a></li>
          <li><a href="opportunities.html">Opportunities</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="employers.html">Employers</a></li>
          <li><a href="contact.html">Get Help</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="section tool-section">
        <div class="container tool-layout">
          <div class="section-heading">
            <p class="small-heading">APS CALCULATOR</p>
            <h2>Check your admission score.</h2>
            <p>Enter your final subjects and achievement levels to estimate your APS.</p>
          </div>

          <div class="tool-panel">
            <form id="apsForm" class="mini-form">
              <div id="apsSubjectRows" class="aps-subject-rows" aria-live="polite"></div>

              <div class="aps-actions">
                <button type="button" id="addApsSubject" class="button secondary">Add Subject</button>
                <button type="submit" class="button primary">Calculate APS</button>
              </div>
            </form>

            <div class="result-box" id="apsResult">Your APS score will appear here.</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <div class="footer-logo">Open Future<span>+</span></div>
        <p>No Limits. Just Possibilities.</p>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
